name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version
        id: version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version = "([^"]+)"$').Groups[1].Value
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Expected a stable version in MAJOR.MINOR.PATCH format."
          }
          if ($version -ne $packageVersion -or $version -ne $cargoVersion) {
            throw "Versions in package.json, Cargo.toml and tauri.conf.json must match."
          }
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists." }
          if ($LASTEXITCODE -ne 2) { throw "Failed to check remote tags." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY must be configured in Actions secrets."
          }
          bun run tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Failed to build signed installer." }
      - name: Publish release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $installers = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows x64 installer." }
          $installer = $installers[0]
          $signaturePath = "$($installer.FullName).sig"
          if (!(Test-Path $signaturePath -PathType Leaf)) { throw "Missing installer signature." }
          $signature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw "Empty installer signature." }
          $manifest = @{
            version = $env:RELEASE_TAG.Substring(1)
            pub_date = [DateTimeOffset]::UtcNow.ToString("o")
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = "https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG/$([Uri]::EscapeDataString($installer.Name))"
              }
            }
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'latest.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding utf8NoBOM
          gh release create $env:RELEASE_TAG $installer.FullName $signaturePath $manifestPath --target $env:GITHUB_SHA --title "NewBee $env:RELEASE_TAG" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release or upload updater artifacts." }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release." }
