[package]
name = "newbee"
version = "0.1.0"
description = "Desktop app for organizing and playing a local music library."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "newbee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.1", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "=2.10.0"
log = "0.4"
regex = "1.13.1"
lofty = "0.25.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "native-tls"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "flac", "mp4", "symphonia-alac", "wav", "vorbis"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sqlite3-parser = { version = "=0.17.0", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
webp = { version = "0.3.1", default-features = false }
sha2 = "0.10.9"
tempfile = "3.27.0"
tauri-plugin-global-shortcut = "2.4.0"

[dev-dependencies]
tauri = { version = "~2.12.1", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Large cover decoding and thumbnail generation must stay responsive in tauri dev.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Foundation", "Media", "Storage_Streams", "Win32_System_WinRT", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell"] }
